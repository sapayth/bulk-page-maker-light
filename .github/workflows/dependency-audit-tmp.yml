# DESCRIPTION: TEMPORARY. Builds the plugin with the old (master) and new lockfile and compares the output.
# DESCRIPTION: Read-only token, no secrets. Removed again before the PR is opened.
name: Dependency build check (temporary)

on:
  push:
    branches: ['fix/npm-audit']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        lock: [master, branch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Use master's lockfile for the baseline build
        if: matrix.lock == 'master'
        run: git show origin/master:package-lock.json > package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: NODE_ENV=production npm run build
      - name: Report the output
        run: |
          echo "BUILD|${{ matrix.lock }}|node $(node -v)|wp-scripts $(node -p "require('@wordpress/scripts/package.json').version")|webpack $(node -p "require('webpack/package.json').version")"
          for f in build/*; do echo "BUILD|${{ matrix.lock }}|$f|$(wc -c < "$f")|$(sha256sum "$f" | cut -c1-12)"; done
          for a in build/*.asset.php; do echo "BUILD|${{ matrix.lock }}|deps|$(cat "$a")"; done
